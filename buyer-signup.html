<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Buyer Registration - KisanAuction</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" type="text/css" href="css/bootstrap.css"/>
  <link rel="stylesheet" type="text/css" href="css/bootstrap-grid.css"/>
  <link rel="stylesheet" type="text/css" href="css/style.css"/>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body>

<div class="auth-container">
  
  <!-- Left Side: Hero Image -->
  <div class="auth-hero" style="background-image: url('assets/images/liveauctionimg.png'); background-color: #f6f0dd; background-size: cover; background-position: center;">
    <div class="auth-hero-overlay" style="background: linear-gradient(135deg, rgba(252,163,17,0.8), rgba(24,154,180,0.6));">
      <div>
        <h1 class="display-4 fw-bold mb-4">A Smarter Way<br>to Source</h1>
        <p class="fs-5">Instant access to local harvests through live, competitive bidding.</p>
      </div>
    </div>
  </div>

  <!-- Right Side: Form -->
  <div class="auth-form-side" style="overflow-y: auto;">
    <div class="auth-box glass-panel text-center my-4">
      
      <!-- Back to Home -->
      <div class="text-start mb-4">
        <a href="index.html" class="text-muted text-decoration-none border rounded px-3 py-1 bg-white shadow-sm">
          <i class="bi bi-arrow-left me-1"></i> Home
        </a>
      </div>

      <img src="assets/images/buyersnap.jpg" class="circle-avatar" alt="Buyer" style="border-color: var(--accent-color);">
      <h2 class="mb-4">Create Buyer Account</h2>
      
      <form id="form" class="text-start">
        <label class="form-label text-muted small fw-bold">Full Name</label>
        <input type="text" id="bname" class="custom-input mb-3" placeholder="Enter Full Name" required>

        <label class="form-label text-muted small fw-bold">Business Address</label>
        <input type="text" id="badd" class="custom-input mb-3" placeholder="Enter Address" required>

        <label class="form-label text-muted small fw-bold">Email Address</label>
        <input type="email" id="bemail" class="custom-input mb-3" placeholder="Email Address" required>

        <label class="form-label text-muted small fw-bold">Mobile Number</label>
        <input type="number" id="bmobile" class="custom-input mb-3" placeholder="Mobile" required>

        <label class="form-label text-muted small fw-bold">Password</label>
        <input type="password" id="bpassword" class="custom-input mb-4" placeholder="Create Password" required>

        <button type="submit" class="premium-btn premium-btn-accent w-100 mb-4">Register Account</button>
      </form>
      
      <p class="text-muted">
        Already have an account? <a href="buyer-login.html" class="auth-link">Sign In</a>
      </p>

    </div>
  </div>

</div>

<script type="module">
  import { buyerSignup } from "./auth.js";

  document.querySelector("#form").addEventListener("submit", function(e){
    e.preventDefault();

    const name = document.getElementById("bname").value;
    const address = document.getElementById("badd").value;
    const email = document.getElementById("bemail").value;
    const mobile = document.getElementById("bmobile").value;
    const password = document.getElementById("bpassword").value;

    const btn = this.querySelector('button');
    const originalText = btn.innerText;
    btn.innerText = "Registering...";
    btn.disabled = true;

    buyerSignup(email, password, { name, address, mobile});

    setTimeout(() => {
      btn.innerText = originalText;
      btn.disabled = false;
    }, 2000);
  });
</script>

</body>
</html>
